<!doctype html>
<html lang="es">
<head>

<style>

<div class="boot"><div class="card"><div class="logo">CD</div><h1>Cusco Decide · Yanatile 2026</h1><p>Cargando encuesta distrital…</p><div id="error" class="error">No se pudo cargar la encuesta. Actualiza la página.</div></div></div>
<script>
(async()=>{
  try{
    const response=await fetch('./index.html?template=yanatile-v3',{cache:'no-store'});
    if(!response.ok) throw new Error('template');
    let html=await response.text();
    html=html
      .replaceAll('lares-alcaldia-2026','yanatile-alcaldia-2026')
      .replaceAll('¡Lares opina!','¡Yanatile opina!')
      .replaceAll('¡LARES OPINA!','¡YANATILE OPINA!')
      .replaceAll('Lares 2026','Yanatile 2026')
      .replaceAll('de Lares','de Yanatile')
      .replaceAll('en Lares','en Yanatile')
      .replaceAll('Lares y','Yanatile y')
      .replaceAll('Ej.: Yanatile, Choquecancha…','Ej.: Quebrada Honda, Amparaes, Colca…')
      .replaceAll("const SHARE_URL='https://lukasandgeorgeth87.github.io/CUSCO-DECIDE-ELECCIONES-2026/';","const SHARE_URL='https://lukasandgeorgeth87.github.io/CUSCO-DECIDE-ELECCIONES-2026/yanatile.html';")
      .replaceAll('content="https://lukasandgeorgeth87.github.io/CUSCO-DECIDE-ELECCIONES-2026/"','content="https://lukasandgeorgeth87.github.io/CUSCO-DECIDE-ELECCIONES-2026/yanatile.html"')
      .replaceAll('href="https://lukasandgeorgeth87.github.io/CUSCO-DECIDE-ELECCIONES-2026/"','href="https://lukasandgeorgeth87.github.io/CUSCO-DECIDE-ELECCIONES-2026/yanatile.html"')
      .replace('.photo{width:96px;height:116px;background:#ebe3db;overflow:hidden;display:grid;place-items:center}.photo img{width:100%;height:100%;object-fit:cover;object-position:center top}', '.photo{width:96px;height:116px;background:#fff;overflow:hidden;display:grid;place-items:center;padding:12px;border-right:1px solid var(--line)}.photo img{width:100%;height:100%;object-fit:contain;object-position:center}.symbolOnly{width:72px!important;height:72px!important;object-fit:contain!important;background:#fff;border-radius:12px;padding:4px}')
      .replace("function renderCandidates(){$('candidateList').innerHTML='';shuffle(candidates).forEach(c=>{const btn=document.createElement('button');btn.type='button';btn.className='candidateCard';btn.innerHTML='<div class=\"photo\">'+(c.photo_url?'<img loading=\"lazy\" alt=\"Fotografía del candidato\">':avatar())+'</div><div class=\"candidateInfo\"><div class=\"candidateName\"></div><div class=\"partyRow\">'+(c.logo_url?'<img class=\"partyLogo\" loading=\"lazy\" alt=\"Símbolo de organización política\">':'')+'<div class=\"partyText\"><div class=\"party\"></div><span class=\"status\"></span></div></div></div><div class=\"choose\">ELEGIR</div>';const img=btn.querySelector('.photo img');if(img){img.src=c.photo_url;img.alt='Fotografía de '+c.full_name;img.addEventListener('error',()=>{img.parentElement.innerHTML=avatar()},{once:true})}const logo=btn.querySelector('.partyLogo');if(logo){logo.src=c.logo_url;logo.alt='Símbolo de '+(c.political_org||'organización política');logo.addEventListener('error',()=>logo.remove(),{once:true})}btn.querySelector('.candidateName').textContent=c.full_name;btn.querySelector('.party').textContent=c.political_org||'Organización política';btn.querySelector('.status').textContent='JNE: '+(c.jne_status||'estado no disponible');btn.addEventListener('click',()=>openSheet('candidate',c.id,c.full_name,c.political_org||''));$('candidateList').appendChild(btn)})}", "function renderCandidates(){$('candidateList').innerHTML='';shuffle(candidates).forEach(c=>{const btn=document.createElement('button');btn.type='button';btn.className='candidateCard';btn.innerHTML='<div class=\"photo\">'+(c.logo_url?'<img class=\"symbolOnly\" loading=\"lazy\" alt=\"Símbolo de organización política\">':avatar())+'</div><div class=\"candidateInfo\"><div class=\"candidateName\"></div><div class=\"partyRow\"><div class=\"partyText\"><div class=\"party\"></div><span class=\"status\"></span></div></div></div><div class=\"choose\">ELEGIR</div>';const symbol=btn.querySelector('.symbolOnly');if(symbol){symbol.src=c.logo_url;symbol.alt='Símbolo de '+(c.political_org||'organización política');symbol.addEventListener('error',()=>{symbol.parentElement.innerHTML=avatar()},{once:true})}btn.querySelector('.candidateName').textContent=c.full_name;btn.querySelector('.party').textContent=c.political_org||'Organización política';btn.querySelector('.status').textContent='JNE: '+(c.jne_status||'estado no disponible');btn.addEventListener('click',()=>openSheet('candidate',c.id,c.full_name,c.political_org||''));$('candidateList').appendChild(btn)})}")
      .replace('Fuente de candidaturas, fotografías y símbolos: JNE – Voto Informado ERM 2026','Fuente de candidaturas y símbolos: JNE – Voto Informado ERM 2026')
      .replace('Fuente de candidaturas, fotografías y símbolos','Fuente de candidaturas y símbolos')
      .replace('</style>','.botWarning{margin:10px 2px 4px;padding:10px 11px;border:1px solid #e1c88b;border-left:4px solid #b98721;border-radius:10px;background:#fff7de;color:#5b4719;font-size:9.5px;line-height:1.45;font-weight:800}.botWarning strong{display:block;font-size:10.5px;margin-bottom:2px}</style>')
      .replace('</main>','<div class="botWarning"><strong>⚠️ Control de participación</strong>Las participaciones automatizadas, duplicadas o detectadas como actividad no válida podrán ser anuladas y excluidas de los resultados referenciales del sondeo.</div></main>');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('error').style.display='block';
  }
})();
</script>
</body>
</html>
