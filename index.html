<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#711f2d">
<title>Cusco Decide | Lares 2026</title>
<style>html,body{margin:0;background:#f5f2ed;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:#1d1b19}.boot{max-width:760px;margin:auto;padding:18px}.card{margin-top:18vh;background:#fff;border:1px solid #e8e0d8;border-radius:18px;padding:22px;text-align:center}.logo{width:48px;height:48px;border-radius:13px;background:#711f2d;color:#fff;display:grid;place-items:center;margin:0 auto 12px;font-weight:900}.card h1{font-size:22px;margin:0 0 7px}.card p{font-size:13px;color:#746d67;margin:0}.error{display:none;margin-top:12px;color:#8a2535;font-size:12px}</style>
</head>
<body>
<div class="boot"><div class="card"><div class="logo">CD</div><h1>Cusco Decide · Lares 2026</h1><p>Cargando fase reforzada del sondeo…</p><div id="error" class="error">No se pudo cargar la encuesta. Actualiza la página.</div></div></div>
<script>
(async()=>{
  try{
    const response=await fetch('./lares-template.html?secure=lares-v2',{cache:'no-store'});
    if(!response.ok) throw new Error('template');
    let html=await response.text();
    html=html
      .replaceAll("const SURVEY='lares-alcaldia-2026';","const SURVEY='lares-alcaldia-2026-seguro';")
      .replace('Votación conectada','Votación reforzada')
      .replace('<div class="notice">Los resultados de este sondeo son referenciales y no tienen sustento científico.</div>','<div class="notice">Los resultados de este sondeo son referenciales y no tienen sustento científico.</div><div class="notice" style="background:#eef8f3;border-color:#b8dccb;border-left-color:#1d7654;color:#176343">🔐 Fase reforzada tras auditoría de integridad. El registro anterior fue archivado por presentar patrones anómalos de participación. Los resultados mostrados aquí corresponden únicamente a esta nueva fase.</div>')
      .replace('El orden se muestra aleatoriamente para mantener neutralidad.','El orden se muestra aleatoriamente para mantener neutralidad. Control antiabuso y límites por conexión activos.');
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    document.getElementById('error').style.display='block';
  }
})();
</script>
</body>
</html>
